name: Build Runtime Components

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime release version (for example 2026.09.26)
        required: true
        default: 2026.10.03
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: write

# One release is published only after every selected platform archive exists.
# This prevents matrix jobs racing to create/upload the same Release asset.
concurrency:
  group: runtime-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            package: zip
          - name: Windows ARM64
            os: windows-11-arm
            package: zip
          - name: macOS Intel
            os: macos-15-intel
            package: tar
          - name: macOS Apple Silicon
            os: macos-14
            package: tar
          - name: Linux x64
            os: ubuntu-latest
            package: tar
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            package: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force staging/bin, downloads | Out-Null
          # Hosted ARM runners do not consistently expose winget packages.  Use
          # maintained upstream Windows releases instead; x64 media tools run
          # under Windows-on-ARM emulation and work on both Windows matrices.
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile downloads/ffmpeg.zip
          Expand-Archive -LiteralPath downloads/ffmpeg.zip -DestinationPath downloads/ffmpeg
          $ffmpeg = Get-ChildItem downloads/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem downloads/ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg archive does not contain ffmpeg.exe and ffprobe.exe.' }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination staging/bin/ffmpeg.exe
          Copy-Item -LiteralPath $ffprobe.FullName -Destination staging/bin/ffprobe.exe
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip' -OutFile downloads/aria2.zip
          Expand-Archive -LiteralPath downloads/aria2.zip -DestinationPath downloads/aria2
          $aria = Get-ChildItem downloads/aria2 -Recurse -Filter aria2c.exe | Select-Object -First 1
          if (-not $aria) { throw 'aria2 archive does not contain aria2c.exe.' }
          Get-ChildItem $aria.DirectoryName -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination staging/bin
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile staging/bin/yt-dlp.exe
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe','aria2c.exe','yt-dlp.exe')) {
            $path = Join-Path staging/bin $tool
            if (-not (Test-Path -LiteralPath $path)) { throw "Required runtime tool is missing: $tool" }
            & $path --version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "Runtime validation failed: $tool" }
          }
      - name: Prepare macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install ffmpeg aria2 yt-dlp mpv
          mkdir -p staging/bin staging/lib
          cp "$(command -v ffmpeg)" staging/bin/
          cp "$(command -v ffprobe)" staging/bin/
          cp "$(command -v aria2c)" staging/bin/
          cp "$(command -v yt-dlp)" staging/bin/
          MPV_PREFIX="$(brew --prefix mpv)"
          find "$MPV_PREFIX" -name 'libmpv*.dylib' -maxdepth 3 -type f -exec cp {} staging/lib/ \; || true
      - name: Prepare Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 zip
          python -m pip install --user --upgrade yt-dlp
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p staging/bin
          cp "$(command -v ffmpeg)" staging/bin/
          cp "$(command -v ffprobe)" staging/bin/
          cp "$(command -v aria2c)" staging/bin/
          cp "$(command -v yt-dlp)" staging/bin/
      - name: Write runtime manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          bin_dir = Path('staging/bin')
          tools = sorted(p.name for p in bin_dir.iterdir() if p.is_file())
          Path('staging/runtime-manifest.json').write_text(json.dumps({
              'schema': 1, 'platform': platform.system(), 'arch': platform.machine(),
              'tools': tools, 'libmpv_optional': True
          }, indent=2), encoding='utf-8')
          PY
      - name: Archive runtime
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#runtime-v}"
          SAFE_ARCH="${{ runner.arch }}"
          if [ "${{ matrix.package }}" = zip ]; then
            7z a "runtime-v${VERSION}-${{ runner.os }}-${SAFE_ARCH}.zip" ./staging/*
          else
            tar -czf "runtime-v${VERSION}-${{ runner.os }}-${SAFE_ARCH}.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Runtime-${{ matrix.name }}
          path: runtime-v*

  publish:
    name: Publish Runtime Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Runtime-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete Runtime asset set
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -type f -name 'runtime-v*' | wc -l)" -eq 6
      - name: Publish public runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#runtime-v}"
          TAG="runtime-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "YTDLP Studio Runtime ${VERSION}" --generate-notes
          fi
          gh release upload "$TAG" release-assets/runtime-v* --clobber
