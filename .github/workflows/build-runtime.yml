name: Build Runtime Components

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime release version (for example 2026.09.26)
        required: true
        default: 2026.10.03
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: write

# One release is published only after every selected platform archive exists.
# This prevents matrix jobs racing to create/upload the same Release asset.
concurrency:
  group: runtime-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            package: zip
          - name: macOS Intel
            os: macos-15-intel
            package: tar
          - name: macOS Apple Silicon
            os: macos-14
            package: tar
          - name: Linux x64
            os: ubuntu-latest
            package: tar
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            package: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winget install --id Gyan.FFmpeg -e --accept-package-agreements --accept-source-agreements
          New-Item -ItemType Directory -Force staging/bin | Out-Null
          # Do not package a Windows App Execution Alias.  Winget may add an
          # aria2c command alias that works on the runner but is not the real
          # executable and fails as soon as the Runtime archive is installed.
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe')) {
            $command = Get-Command $tool -ErrorAction Stop
            if ($command.CommandType -ne 'Application') { throw "Expected an application for $tool, got $($command.CommandType)" }
            $source = (Resolve-Path -LiteralPath $command.Source).Path
            Copy-Item -LiteralPath $source -Destination (Join-Path staging/bin $tool)
          }

          $ariaArchive = Join-Path $PWD 'aria2-runtime.zip'
          $ariaStage = Join-Path $PWD 'aria2-runtime'
          Invoke-WebRequest -Uri 'https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip' -OutFile $ariaArchive
          Expand-Archive -LiteralPath $ariaArchive -DestinationPath $ariaStage -Force
          $ariaExecutable = Get-ChildItem -LiteralPath $ariaStage -Recurse -File -Filter 'aria2c.exe' | Select-Object -First 1
          if (-not $ariaExecutable) { throw 'Official aria2 archive does not contain aria2c.exe' }
          Copy-Item -LiteralPath $ariaExecutable.FullName -Destination 'staging/bin/aria2c.exe'
          Get-ChildItem -LiteralPath $ariaExecutable.Directory.FullName -File -Filter '*.dll' | Copy-Item -Destination 'staging/bin'

          # yt-dlp is intentionally a standalone official executable, not an
          # installed application alias.  The Studio may update this file later.
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'staging/bin/yt-dlp.exe'

          # libmpv is shipped with the tool Runtime on Windows so the player
          # does not depend on a separately installed browser or media suite.
          # The development archive contains the loadable libmpv DLL together
          # with its matching dependency DLLs; copying only libmpv itself would
          # pass a file-exists check but fail when the player opens.
          $mpvRelease = Invoke-RestMethod -Headers @{ 'User-Agent' = 'YTDLP-Studio-Runtime' } -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $mpvAsset = $mpvRelease.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-.*\.7z$' } | Select-Object -First 1
          if (-not $mpvAsset) { throw 'Latest mpv Windows release has no x64 development archive' }
          $mpvArchive = Join-Path $PWD $mpvAsset.name
          $mpvStage = Join-Path $PWD 'mpv-runtime'
          Invoke-WebRequest -Uri $mpvAsset.browser_download_url -OutFile $mpvArchive
          & 7z x $mpvArchive "-o$mpvStage" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract the mpv Windows development archive' }
          $mpvDlls = Get-ChildItem -LiteralPath $mpvStage -Recurse -File -Filter '*.dll'
          $mpvLibrary = $mpvDlls | Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll','libmpv.dll') } | Select-Object -First 1
          if (-not $mpvLibrary) { throw 'mpv Windows development archive does not contain a supported libmpv DLL' }
          $mpvDlls | Copy-Item -Destination 'staging/bin'

          # Validate with only the staging directory and System32 available.
          # This catches missing adjacent DLLs that an Actions runner might hide.
          $savedPath = $env:PATH
          $env:PATH = "$(Resolve-Path $env:SystemRoot\System32);$(Resolve-Path 'staging/bin')"
          try {
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe','aria2c.exe','yt-dlp.exe')) {
            $path = Join-Path staging/bin $tool
            if (-not (Test-Path -LiteralPath $path)) { throw "Required runtime tool is missing: $tool" }
            $versionArg = if ($tool -in @('ffmpeg.exe','ffprobe.exe')) { '-version' } else { '--version' }
            & $path $versionArg | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) { throw "Runtime validation failed: $tool" }
          }
          $mpvLibrary = Get-ChildItem -LiteralPath 'staging/bin' -File | Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll','libmpv.dll') } | Select-Object -First 1
          if (-not $mpvLibrary) { throw 'Runtime validation failed: libmpv DLL is missing' }
          $env:MPV_RUNTIME_DIRECTORY = (Resolve-Path 'staging/bin').Path
          $env:MPV_RUNTIME_LIBRARY = $mpvLibrary.FullName
          python -c 'import ctypes, os; os.add_dll_directory(os.environ["MPV_RUNTIME_DIRECTORY"]); ctypes.WinDLL(os.environ["MPV_RUNTIME_LIBRARY"]); print("libmpv load OK")'
          if ($LASTEXITCODE -ne 0) { throw 'Runtime validation failed: libmpv cannot load with its packaged dependencies' }
          } finally {
            $env:PATH = $savedPath
          }
      - name: Prepare macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Hosted runners already ship current Homebrew metadata.  Updating it
          # here adds several idle minutes and can stall the whole Release.
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg aria2 yt-dlp mpv
          mkdir -p staging/bin staging/lib
          cp "$(command -v ffmpeg)" staging/bin/
          cp "$(command -v ffprobe)" staging/bin/
          cp "$(command -v aria2c)" staging/bin/
          cp "$(command -v yt-dlp)" staging/bin/
          MPV_PREFIX="$(brew --prefix mpv)"
          find "$MPV_PREFIX" -name 'libmpv*.dylib' -maxdepth 3 -type f -exec cp {} staging/lib/ \; || true
      - name: Prepare Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2 zip
          python -m pip install --user --upgrade yt-dlp
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p staging/bin
          cp "$(command -v ffmpeg)" staging/bin/
          cp "$(command -v ffprobe)" staging/bin/
          cp "$(command -v aria2c)" staging/bin/
          cp "$(command -v yt-dlp)" staging/bin/
      - name: Write runtime manifest
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          bin_dir = Path('staging/bin')
          tools = sorted(p.name for p in bin_dir.iterdir() if p.is_file())
          Path('staging/runtime-manifest.json').write_text(json.dumps({
              'schema': 1, 'platform': platform.system(), 'arch': platform.machine(),
              'tools': tools, 'libmpv_optional': True
          }, indent=2), encoding='utf-8')
          PY
      - name: Archive runtime
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${VERSION#runtime-v}"
          SAFE_ARCH="${{ runner.arch }}"
          if [ "${{ matrix.package }}" = zip ]; then
            7z a "runtime-v${VERSION}-${{ runner.os }}-${SAFE_ARCH}.zip" ./staging/*
          else
            tar -czf "runtime-v${VERSION}-${{ runner.os }}-${SAFE_ARCH}.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Runtime-${{ matrix.name }}
          path: runtime-v*

  publish:
    name: Publish Runtime Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: Runtime-*
          path: release-assets
          merge-multiple: true
      - name: Create Windows-on-ARM compatible Runtime asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = next((p for p in Path('release-assets').glob('runtime-v*-Windows-X64.zip') if p.is_file()), None)
          if source is None:
              raise SystemExit('Windows x64 Runtime archive is missing')
          target = source.with_name(source.name.replace('-Windows-X64.zip', '-Windows-ARM64.zip'))
          target.write_bytes(source.read_bytes())
          print(f'Created Windows-on-ARM compatible Runtime: {target.name}')
          PY
      - name: Verify complete Runtime asset set
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -type f -name 'runtime-v*' | wc -l)" -eq 6
      - name: Publish public runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#runtime-v}"
          TAG="runtime-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "YTDLP Studio Runtime ${VERSION}" --generate-notes
          fi
          gh release upload "$TAG" release-assets/runtime-v* --clobber
